name: Update Rayfish

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream release
        id: check
        run: |
          latest="$(gh release view -R rayfish/rayfish --json tagName -q .tagName)"
          version="${latest#v}"
          current="$(sed -n 's/^  version = "\(.*\)";$/\1/p' package.nix)"
          echo "current=$current latest=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ "$version" = "$current" ] || echo "update=true" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v31
        if: steps.check.outputs.update == 'true'

      - name: Update package.nix
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          sed -i "s/^  version = \".*\";$/  version = \"$VERSION\";/" package.nix
          for asset in ray-macos-aarch64 ray-linux-aarch64 ray-linux-x86_64; do
            hash="$(nix store prefetch-file --json \
              "https://github.com/rayfish/rayfish/releases/download/v$VERSION/$asset" | jq -r .hash)"
            sed -i "/asset = \"$asset\";/{n;s|hash = \".*\";|hash = \"$hash\";|}" package.nix
          done
          git diff

      - name: Build and check
        if: steps.check.outputs.update == 'true'
        run: |
          nix build .#packages.x86_64-linux.default
          ./result/bin/ray --version
          nix flake check --all-systems

      - name: Commit
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Rayfish to v$VERSION"
          git push
